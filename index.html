<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <title>Genius</title>
</head>
<body>
  <main class="game">
    <h1>Genius</h1>

    <!-- Instruções de como jogar -->
    <p class="instrucoes">
      Observe a sequência de cores que acende e repita na mesma ordem,
      clicando nos botões. A cada rodada entra uma cor nova. Se errar, o jogo acaba.
    </p>

    <!-- Área de informações do jogo -->
    <div class="info">
      <p id="status">Aperte iniciar para jogar</p>
      <p>Rodada: <span id="round">0</span> &nbsp;|&nbsp; Recorde: <span id="best">0</span></p>
    </div>

    <!-- Tabuleiro com os 4 botões coloridos -->
    <div class="board" id="board">
      <button class="pad green" data-color="green" aria-label="Verde" disabled></button>
      <button class="pad red" data-color="red" aria-label="Vermelho" disabled></button>
      <button class="pad yellow" data-color="yellow" aria-label="Amarelo" disabled></button>
      <button class="pad blue" data-color="blue" aria-label="Azul" disabled></button>
    </div>

    <button id="start" class="start">Iniciar</button>

    <!-- Liga e desliga o som do jogo -->
    <button id="mute" class="mute" aria-pressed="false">🔊 Som ligado</button>
  </main>

  <script src="js/jogo.js"></script>
</body>
</html>
